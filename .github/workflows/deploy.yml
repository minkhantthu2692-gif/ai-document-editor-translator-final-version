# Builds the app and deploys it to GitHub Pages.
#
# Base path is configurable: set a repository variable named `VITE_BASE`
# (e.g. `/my-fork/`) if you deploy under a different sub-path. The default is
# `/<repository-name>/`, which is what a GitHub Pages *project* site needs.
# A repository named `<user>.github.io` should set `VITE_BASE=/`.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}

      - name: SPA fallback for Pages
        # GitHub Pages serves 404.html on unknown paths; copying index.html
        # there gives client-side routes (/workspace, /logs, …) a working reload.
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
